<svg xmlns="http://www.w3.org/2000/svg" id="premium-icon-analytics-bars" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Analytics Bars" data-creator="Jelvan Elements" data-collection="Premium Icon Studio">
<title>Analytics Bars — Jelvan Elements premium vector icon</title>
<desc>Business original vector icon. Includes subtle CSS animation and reduced-motion support.</desc>
