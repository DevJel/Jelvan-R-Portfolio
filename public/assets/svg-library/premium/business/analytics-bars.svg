<defs><linearGradient id="premium-surface-analytics-bars" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1D2C3E"/><stop offset="1" stop-color="#0B121F"/></linearGradient><linearGradient id="premium-edge-analytics-bars" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#A3D49B"/><stop offset="1" stop-color="#FF9A56"/></linearGradient></defs>
<style>
@keyframes orbit{to{transform:rotate(360deg)}}
