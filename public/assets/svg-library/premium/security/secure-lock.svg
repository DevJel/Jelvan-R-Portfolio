<svg xmlns="http://www.w3.org/2000/svg" id="premium-icon-secure-lock" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Secure Lock" data-creator="Jelvan Elements" data-collection="Premium Icon Studio">
<title>Secure Lock — Jelvan Elements premium vector icon</title>
