<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Code Brackets" data-creator="Jelvan Elements" data-collection="Premium Icon Studio">
<title>Code Brackets — Jelvan Elements premium vector icon</title>
<desc>Developer original vector icon. Includes subtle CSS animation and reduced-motion support.</desc>
<metadata>Jelvan Elements | Developer | code-brackets | Original vector artwork</metadata>
<defs><linearGradient id="surface" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1D2C3E"/><stop offset="1" stop-color="#0B121F"/></linearGradient><linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#65C5EB"/><stop offset="1" stop-color="#FF9A56"/></linearGradient></defs>
<style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.26;transform:scale(.86)}50%{opacity:1;transform:scale(1.12)}}
@keyframes drift{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
@keyframes shimmer{0%,100%{opacity:.16}50%{opacity:.85}}
.motion{transform-box:fill-box;transform-origin:center;animation:orbit 8s linear infinite;}
@media(prefers-reduced-motion:reduce){.motion{animation:none!important}}
</style>
