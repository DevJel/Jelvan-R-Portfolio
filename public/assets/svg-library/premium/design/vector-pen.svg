<g class="motion"><circle cx="60" cy="60" r="45" fill="none" stroke="#F6A4C4" stroke-width="1.6" stroke-dasharray="8 20" opacity=".65"/><circle cx="60" cy="15" r="3.5" fill="#FFAD61"/></g>
