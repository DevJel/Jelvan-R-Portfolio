<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Prompt Stars" data-creator="Jelvan Elements" data-collection="Premium Icon Studio">
<title>Prompt Stars — Jelvan Elements premium vector icon</title>
<desc>AI original vector icon. Includes subtle CSS animation and reduced-motion support.</desc>
