<defs><linearGradient id="surface" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1D2C3E"/><stop offset="1" stop-color="#0B121F"/></linearGradient><linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#BBAAFF"/><stop offset="1" stop-color="#FF9A56"/></linearGradient></defs>
<style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.26;transform:scale(.86)}50%{opacity:1;transform:scale(1.12)}}
@keyframes drift{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
