<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
<linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF8C1A"/><stop offset="100%" stop-color="#FF6A00"/></linearGradient>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A1A1A"/><stop offset="100%" stop-color="#0D0D0D"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.5"/></filter>
<linearGradient id="hs" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2A2A2A"/><stop offset="100%" stop-color="#3A3A3A"/></linearGradient>
</defs>
<!-- Card body -->
<rect x="50" y="60" width="300" height="180" rx="12" fill="url(#bg)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
<!-- Fans -->
<g transform="translate(110, 130)">
  <circle cx="0" cy="0" r="45" fill="#222" stroke="#444" stroke-width="2"/>
  <circle cx="0" cy="0" r="35" fill="url(#og)" opacity="0.9"/>
  <g id="fan1"><path d="M0,-30 Q10,-10 0,0 Q-10,10 0,30 Q10,10 30,0 Q10,-10 0,-30" fill="#111" opacity="0.8"/><circle cx="0" cy="0" r="8" fill="#111"/></g>
</g>
<g transform="translate(200, 130)">
  <circle cx="0" cy="0" r="45" fill="#222" stroke="#444" stroke-width="2"/>
  <circle cx="0" cy="0" r="35" fill="url(#og)" opacity="0.9"/>
  <g><path d="M0,-30 Q10,-10 0,0 Q-10,10 0,30 Q10,10 30,0 Q10,-10 0,-30" fill="#111" opacity="0.8" transform="rotate(60)"/><circle cx="0" cy="0" r="8" fill="#111"/></g>
</g>
<g transform="translate(290, 130)">
  <circle cx="0" cy="0" r="45" fill="#222" stroke="#444" stroke-width="2"/>
  <circle cx="0" cy="0" r="35" fill="url(#og)" opacity="0.9"/>
  <g><path d="M0,-30 Q10,-10 0,0 Q-10,10 0,30 Q10,10 30,0 Q10,-10 0,-30" fill="#111" opacity="0.8" transform="rotate(120)"/><circle cx="0" cy="0" r="8" fill="#111"/></g>
</g>
<!-- Heatsink fins -->
<rect x="60" y="190" width="280" height="12" rx="2" fill="url(#hs)"/>
<rect x="60" y="206" width="280" height="8" rx="2" fill="#2A2A2A"/>
<!-- Brand plate -->
<rect x="140" y="230" width="120" height="20" rx="4" fill="#111" stroke="#FF6A00" stroke-width="1"/>
<text x="200" y="244" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="12" fill="#FF8C1A" font-weight="bold">GEFORCE</text>
<!-- PCIe connector -->
<rect x="80" y="240" width="240" height="30" rx="2" fill="#111" stroke="#444" stroke-width="1.5"/>
<g fill="#D4AF37">
  <rect x="90" y="245" width="8" height="20" rx="1"/><rect x="102" y="245" width="8" height="20" rx="1"/><rect x="114" y="245" width="8" height="20" rx="1"/><rect x="126" y="245" width="8" height="20" rx="1"/><rect x="140" y="245" width="40" height="20" rx="1" fill="#222"/><rect x="190" y="245" width="8" height="20" rx="1"/><rect x="202" y="245" width="8" height="20" rx="1"/><rect x="214" y="245" width="8" height="20" rx="1"/><rect x="226" y="245" width="8" height="20" rx="1"/><rect x="238" y="245" width="8" height="20" rx="1"/><rect x="250" y="245" width="8" height="20" rx="1"/><rect x="262" y="245" width="8" height="20" rx="1"/><rect x="274" y="245" width="8" height="20" rx="1"/><rect x="286" y="245" width="8" height="20" rx="1"/><rect x="298" y="245" width="8" height="20" rx="1"/>
</g>
<!-- Backplate accent -->
<rect x="50" y="270" width="300" height="8" rx="4" fill="url(#og)" opacity="0.6"/>
<!-- Power connectors -->
<rect x="280" y="65" width="20" height="15" rx="2" fill="#111" stroke="#444"/><rect x="305" y="65" width="20" height="15" rx="2" fill="#111" stroke="#444"/>
</svg>