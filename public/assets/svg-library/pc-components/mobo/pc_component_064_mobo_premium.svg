<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
<linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF8C1A"/><stop offset="100%" stop-color="#FF6A00"/></linearGradient>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A1A1A"/><stop offset="100%" stop-color="#0D0D0D"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.5"/></filter>
<radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#FF8C1A" stop-opacity="0.3"/><stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/></radialGradient>
</defs>

<!-- Background -->
<circle cx="200" cy="200" r="180" fill="url(#bg)" stroke="url(#og)" stroke-width="3"/>
<circle cx="200" cy="200" r="180" fill="url(#glow)"/>

<!-- Motherboard outline -->
<rect x="90" y="110" width="220" height="180" rx="8" fill="none" stroke="#FF8C1A" stroke-width="3" filter="url(#shadow)"/>
<rect x="90" y="110" width="220" height="180" rx="8" fill="#1A1A1A" opacity="0.9"/>

<!-- Inner details -->
<rect x="100" y="120" width="200" height="160" rx="4" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

<!-- CPU socket area -->
<rect x="150" y="140" width="100" height="80" rx="4" fill="#2A2A2A" stroke="#FF8C1A" stroke-width="2"/>
<rect x="160" y="150" width="80" height="60" rx="2" fill="#0D0D0D" stroke="#444" stroke-width="1"/>
<!-- CPU pins grid -->
<g fill="#FF8C1A" opacity="0.6">
<circle cx="170" cy="160" r="2"/><circle cx="180" cy="160" r="2"/><circle cx="190" cy="160" r="2"/><circle cx="200" cy="160" r="2"/><circle cx="210" cy="160" r="2"/><circle cx="220" cy="160" r="2"/>
<circle cx="170" cy="170" r="2"/><circle cx="180" cy="170" r="2"/><circle cx="190" cy="170" r="2"/><circle cx="200" cy="170" r="2"/><circle cx="210" cy="170" r="2"/><circle cx="220" cy="170" r="2"/>
<circle cx="170" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="190" cy="180" r="2"/><circle cx="200" cy="180" r="2"/><circle cx="210" cy="180" r="2"/><circle cx="220" cy="180" r="2"/>
<circle cx="170" cy="190" r="2"/><circle cx="180" cy="190" r="2"/><circle cx="190" cy="190" r="2"/><circle cx="200" cy="190" r="2"/><circle cx="210" cy="190" r="2"/><circle cx="220" cy="190" r="2"/>
</g>

<!-- RAM slots -->
<rect x="270" y="130" width="12" height="60" rx="2" fill="#333" stroke="#FF8C1A" stroke-width="1"/>
<rect x="286" y="130" width="12" height="60" rx="2" fill="#333" stroke="#FF8C1A" stroke-width="1"/>

<!-- PCIe slots -->
<rect x="110" y="240" width="80" height="10" rx="2" fill="#FF8C1A" opacity="0.8"/>
<rect x="110" y="255" width="80" height="10" rx="2" fill="#555" opacity="0.8"/>
<rect x="200" y="240" width="60" height="10" rx="2" fill="#FF8C1A" opacity="0.6"/>

<!-- Power connectors -->
<rect x="110" y="125" width="15" height="20" rx="2" fill="#222" stroke="#444" stroke-width="1"/>
<circle cx="117" cy="132" r="2" fill="#FF8C1A"/><circle cx="117" cy="138" r="2" fill="#FF8C1A"/>

<!-- Chipset heatsink -->
<rect x="115" y="185" width="25" height="25" rx="3" fill="url(#og)" opacity="0.9"/>
<g stroke="#0D0D0D" stroke-width="1" opacity="0.5">
<line x1="115" y1="192" x2="140" y2="192"/><line x1="115" y1="198" x2="140" y2="198"/><line x1="115" y1="204" x2="140" y2="204"/>
</g>

<!-- Corner mounting holes -->
<g fill="#1A1A1A" stroke="#FF8C1A" stroke-width="1.5">
<circle cx="100" cy="120" r="5"/><circle cx="300" cy="120" r="5"/><circle cx="100" cy="280" r="5"/><circle cx="300" cy="280" r="5"/>
<circle cx="100" cy="120" r="2" fill="#444" stroke="none"/><circle cx="300" cy="120" r="2" fill="#444" stroke="none"/><circle cx="100" cy="280" r="2" fill="#444" stroke="none"/><circle cx="300" cy="280" r="2" fill="#444" stroke="none"/>
</g>

<!-- Trace lines -->
<g stroke="#FF8C1A" stroke-width="0.8" opacity="0.3" fill="none">
<path d="M 145 210 Q 130 230 110 235"/>
<path d="M 255 150 Q 268 135 285 135"/>
<path d="M 210 220 Q 230 250 260 250"/>
</g>

<!-- Label -->
<text x="200" y="330" text-anchor="middle" fill="#FF8C1A" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="2">MOTHERBOARD</text>
<text x="200" y="345" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10" letter-spacing="1">PREMIUM SERIES</text>
</svg>