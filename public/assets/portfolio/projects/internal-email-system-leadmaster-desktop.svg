<text x="270" y="503" font-size="19" fill="#444">A focused home for the email that matters—from the first hello</text><text x="270" y="530" font-size="19" fill="#444">to every campaign that follows.</text><rect x="270" y="554" width="91" height="48" rx="24" fill="#050505"/><text x="315" y="584" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Log in ↗</text><rect x="372" y="554" width="210" height="48" rx="24" fill="#fff" stroke="#111"/><text x="477" y="584" fill="#111" font-size="15" font-weight="700" text-anchor="middle">Explore LeadMASTER →</text><text x="270" y="648" font-size="14" fill="#555">The administrator email workspace, dedicated inbox and email sending are live.</text><text x="270" y="670" font-size="14" fill="#555">Campaign tools and advanced audience features continue to evolve.</text></g>
