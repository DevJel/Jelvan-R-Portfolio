name: Build & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Brand check (no emoji in site content)
        shell: python3 {0}
        run: |
          import os, re, sys
          emoji = re.compile('[\U0001F000-\U0001FAFF☀-➿⬀-⯿️]')
          found = False
          for folder in ('components', 'pages', 'hooks'):
              for root, _, files in os.walk(folder):
                  for name in files:
                      path = os.path.join(root, name)
                      for n, line in enumerate(open(path, encoding='utf-8'), 1):
                          if emoji.search(line):
                              found = True
                              print(f"::error file={path},line={n}::Emoji found. Remove it to keep the branding clean.")
          sys.exit(1 if found else 0)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate developer tools
        run: npm run test:tools

      - name: Build static site (also type-checks)
        run: npm run build

      - name: Install browser for developer tools checks
        run: npx playwright install --with-deps chromium

      - name: Test developer tools in the browser
        run: npm run test:tools:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-tools-screenshots
          path: .test-artifacts
          retention-days: 7

      - name: Check export output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/portfolio/about.html
          test -f out/portfolio/projects.html
          test -f out/portfolio/contact.html
          test -f out/portfolio/resume.html
          test -f out/articles.html
          test -f out/tools.html
          grep -q 'HTML Viewer' out/tools.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/llms.txt
          test -f out/llms-full.txt
          test -f out/humans.txt
          test -f out/_headers
          test -f out/.well-known/security.txt
          test -f out/jr-bimi-tiny-ps.svg
          grep -q 'baseProfile="tiny-ps"' out/jr-bimi-tiny-ps.svg
          grep -q 'application/ld+json' out/index.html
          grep -q 'rel="canonical" href="https://portfolio.jelvan.pro/"' out/index.html
          grep -q 'portfolio.jelvan.pro/portfolio/resume' out/portfolio/resume.html
          grep -q 'noindex' out/articles.html
          echo "Pages in export:" && find out -name '*.html' | sort

      - name: Validate Worker bundle and wrangler config
        run: npx wrangler deploy --dry-run --outdir dist-worker

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set, skipping deploy. See README → Deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy

