name: Build & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site (also type-checks)
        run: npm run build

      - name: Check export output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/portfolio/about.html
          test -f out/portfolio/projects.html
          test -f out/portfolio/contact.html
          test -f out/portfolio/resume.html
          test -f out/articles.html
          echo "Pages in export:" && find out -name '*.html' | sort

      - name: Validate Worker bundle and wrangler config
        run: npx wrangler deploy --dry-run --outdir dist-worker

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set, skipping deploy. See README → Deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy
